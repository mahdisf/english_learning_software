<div class="card card-vocab">
  <div class="type-badge">Vocabulary</div>
  <div class="headword">{{Word}}</div>
  {{#PartOfSpeech}}<div class="pos">{{PartOfSpeech}}</div>{{/PartOfSpeech}}
  {{#TopicCue}}<div class="context-cue">{{TopicCue}}</div>{{/TopicCue}}

  <div class="coach-id">{{CoachID}}</div>
</div>
