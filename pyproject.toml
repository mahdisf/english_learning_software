[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "english-coach"
version = "1.0.0"
description = "Local AI-powered personal English coach knowledge system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.6,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "genanki>=0.13,<1.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
english-coach = "english_coach.cli:app"

[tool.setuptools.packages.find]
include = ["english_coach", "english_coach.*"]

[tool.setuptools.package-data]
english_coach = ["templates/anki/*.html", "templates/anki/*.css", "templates/reports/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
